[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tiny-memory"
version = "0.1.0"
description = "Persistent conversation memory for AI agents — sliding window, token budget, summary compression, semantic search, dot-notation access. Zero dependencies, one file."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
keywords = [
    "ai",
    "agent",
    "memory",
    "vector-store",
    "semantic-search",
    "bm25",
    "embeddings",
    "embeddings-free",
    "zero-dependency",
    "single-file",
]
authors = [
    { name = "Hussain Alsaibai", email = "hussain.alsaibai@gmail.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
test = []

[project.urls]
Homepage = "https://github.com/hussain-alsaibai/tiny-memory"
Repository = "https://github.com/hussain-alsaibai/tiny-memory"
Issues = "https://github.com/hussain-alsaibai/tiny-memory/issues"

[project.scripts]
tiny-memory = "tiny_memory:main"

[tool.setuptools]
py-modules = ["tiny_memory"]

[tool.setuptools.packages.find]
where = ["."]
include = ["tiny_memory*"]